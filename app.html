document.addEventListener('keydown',e=>{if(e.isComposing)return;if(e.key==='Escape'){$('modal-root').innerHTML='';return;}if(e.target.matches('input,textarea,select,[contenteditable]'))return;if($('modal-root').innerHTML)return;if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo(e.shiftKey);return;}if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();undo(true);return;}if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();save();return;}if(e.ctrlKey&&e.key.toLowerCase()==='f'){e.preventDefault();$('search').focus();return;}if(e.key==='Tab'){e.preventDefault();if(e.shiftKey)indent(true);else addNode(true);}else if(e.key==='Enter'){e.preventDefault();if(e.ctrlKey)toggleDone();else addNode(false);}else if(e.key==='F2'){e.preventDefault();startEdit(selectedId||'root');}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeNode();}else if(e.ctrlKey&&e.key===']'){e.preventDefault();indent(false);}else if(e.ctrlKey&&e.key==='['){e.preventDefault();indent(true);}else if(e.key.startsWith('Arrow')){const ps=[...positions.keys()].filter(id=>id!=='root'),i=ps.indexOf(selectedId);if(ps.length){selectedId=ps[Math.max(0,Math.min(ps.length-1,i+(e.key==='ArrowUp'||e.key==='ArrowLeft'?-1:1)))];render();}e.preventDefault();}});
window.addEventListener('beforeunload',e=>{finishEdit();if(changedVersion!==savedVersion){e.preventDefault();e.returnValue='';save();}});window.addEventListener('resize',()=>{if(!editor)fitMap();});
setInterval(()=>fetch('/api/ping',{headers:{'X-Zhiji-Token':'__SESSION_TOKEN__'}}).catch(()=>{$('save-state').textContent='本地服务已断开 · 请导出备份后重新打开';}),15000);
async function init(){try{library=await api();if(!Array.isArray(library.Documents))throw Error('笔记数据格式错误');normalizeLibrary(library);if(!library.Documents.length){const a=node('想法，从一个主题开始');a.Children=[node('双击文字，记录你的灵感'),node('按 Tab 生长出新的分支')];const b=node('把复杂的事情，变清晰');b.Children=[node('梳理工作计划'),node('搭建学习知识体系')];const c=node('属于你的思考空间');c.Children=[node('自动保存，安心记录'),node('大纲与导图，一键切换')];library.Documents.push(normalizeDoc({Title:'让想法自然生长',Items:[a,b,c],Favorite:true}));}currentId=library.Documents.find(d=>!d.Deleted)?.Id||null;ready=true;render();applyTheme();fitMap();markDirty();}catch(e){$('save-state').textContent='读取失败，原文件未修改';modal('无法读取笔记','<p>'+esc(e.message)+'。请保留本机 notes.json 文件，修复后重启软件。</p>',()=>{},'知道了');}}
</script>
